<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Árbol de corazones</title>
  <style>
    body {
      margin: 0;
      background: #ffe6f0;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
    #texto {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Comic Sans MS', cursive;
      font-size: 24px;
      color: #d63384;
      white-space: pre;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="texto"></div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const centerX = canvas.width / 2;
    const baseY = canvas.height;
    const maxDepth = 6;
    const branchLength = 70;
    const leaves = [];
    const hearts = [];
    const maxHearts = 50;

    function drawHeart(x, y, size, color, rotation = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.scale(size / 16, size / 16);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(0, -3, -5, -3, -5, 0);
      ctx.bezierCurveTo(-5, 3, 0, 6, 0, 8);
      ctx.bezierCurveTo(0, 6, 5, 3, 5, 0);
      ctx.bezierCurveTo(5, -3, 0, -3, 0, 0);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();
    }

    function drawBranch(x, y, angle, depth) {
      if (depth === 0) return;

      const length = branchLength * (depth / maxDepth);
      const xEnd = x + Math.cos(angle) * length;
      const yEnd = y - Math.sin(angle) * length;

      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(xEnd, yEnd);
      ctx.lineWidth = depth;
      ctx.strokeStyle = "#5b3924";
      ctx.stroke();

      // Agrega corazones a lo largo de la rama
      const steps = 3;
      for (let i = 1; i <= steps; i++) {
        const t = i / (steps + 1);
        const xLeaf = x + (xEnd - x) * t;
        const yLeaf = y + (yEnd - y) * t;
        leaves.push({ x: xLeaf, y: yLeaf });
      }

      // Ramas izquierda y derecha
      const spread = 0.4;
      drawBranch(xEnd, yEnd, angle - spread, depth - 1);
      drawBranch(xEnd, yEnd, angle + spread, depth - 1);
    }

    class FallingHeart {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * -canvas.height;
        this.size = Math.random() * 8 + 8;
        this.speed = Math.random() * 1 + 0.5;
        this.angle = Math.random() * 2 * Math.PI;
      }

      draw() {
        drawHeart(this.x, this.y, this.size, "pink", this.angle);
      }

      update() {
        this.y += this.speed;
        this.angle += 0.01;
        if (this.y > canvas.height) {
          this.y = Math.random() * -canvas.height;
          this.x = Math.random() * canvas.width;
        }
      }
    }

    function drawTree() {
      leaves.length = 0;
      drawBranch(centerX, baseY, Math.PI / 2, maxDepth);
    }

    function drawLeaves() {
      leaves.forEach(pos => {
        const size = Math.random() * 6 + 6;
        const rot = Math.random() * Math.PI;
        drawHeart(pos.x, pos.y, size, "red", rot);
      });
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawTree();
      drawLeaves();

      if (hearts.length < maxHearts) {
        hearts.push(new FallingHeart());
      }

      hearts.forEach(h => {
        h.update();
        h.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();

    // Texto animado
    const mensaje = "🌷 esto es lo que queria hacer para ti, espero que te guste mucho, te amo mucho y siempre estare contigo\n nunca dudare estar contigo acompañandote en todo lo que hagas🌸";
    const divTexto = document.getElementById("texto");
    let index = 0;
    function escribirTexto() {
      if (index < mensaje.length) {
        divTexto.textContent += mensaje[index];
        index++;
        setTimeout(escribirTexto, 80);
      }
    }
    escribirTexto();
  </script>
</body>
</html>
